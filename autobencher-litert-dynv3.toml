model = "minicpm5-dynv3-16k"
engine = "external"
api_base = "http://127.0.0.1:9380"
api_key_env = "AUTOBENCHER_API_KEY"
workspace = ".autobencher"
parallel = 1
seed = 42
model_card_url = "https://huggingface.co/openbmb/MiniCPM5-2B/raw/main/README.md"
evalscope_spec = "evalscope>=1.11.0"
eval_batch_size = 1
generation_config = '{"max_tokens":512,"temperature":0.0,"top_p":1.0}'

[vllm]
executable = "vllm"
port = 8000
host = "127.0.0.1"
tensor_parallel_size = 1
gpu_memory_utilization = 0.90
max_model_len = 131072
extra_args = ["--enable-auto-tool-choice", "--tool-call-parser", "minicpm5"]
