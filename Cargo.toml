[package]
name = "autobencher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reproducible, resumable orchestration for heterogeneous LLM benchmark suites"
repository = "https://github.com/adybag14-cyber/AutoBencher"
keywords = ["llm", "benchmark", "evaluation", "vllm", "evalscope"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hostname = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.33"
tokio = { version = "1.48", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
