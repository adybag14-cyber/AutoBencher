name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_litert_android_server.py
      - run: python -m unittest discover -s scripts -p test_compare_gpqa_runs.py
      - run: python -m unittest discover -s scripts -p test_select_mobile_precision.py

  litert-precision-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ai-edge-litert-nightly==2.3.0.dev20260909
      - run: python -m unittest discover -s scripts -p test_audit_litert_precision.py
      - run: python -m unittest discover -s scripts -p test_repair_litert_npu.py
