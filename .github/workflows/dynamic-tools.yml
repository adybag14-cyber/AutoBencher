name: Dynamic LiteRT tooling
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/dynamic-tools.yml']
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/dynamic-tools.yml']
permissions:
  contents: read
jobs:
  control-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q scripts
      - run: python scripts/test_dynamic_selection.py
      - run: python scripts/test_full_precision_control.py
